# docker-compose.yml
version: '3.7'
services:
  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - 8081:8080
      - 50000:50000
    container_name: jenkins_lts
    volumes:
      - "D:/I4-II/DevOps/application-project/jenkins_home:/var/jenkins_home"
    links:
      - "db:database"
  db:
    image: mysql:latest
    user: root
    container_name: mysql-i4d
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - "D:/I4-II/DevOps/docker/mysql:/var/lib/mysql"